$mainMod = SUPER
$secMod = SUPER SHIFT

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, rofi -show drun

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $secMod, 1, movetoworkspace, 1
bind = $secMod, 2, movetoworkspace, 2
bind = $secMod, 3, movetoworkspace, 3
bind = $secMod, 4, movetoworkspace, 4
bind = $secMod, 5, movetoworkspace, 5
bind = $secMod, 6, movetoworkspace, 6
bind = $secMod, 7, movetoworkspace, 7
bind = $secMod, 8, movetoworkspace, 8
bind = $secMod, 9, movetoworkspace, 9

bind = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = , XF86KbdBrightnessUp, exec, brightnessctl -d smc::kbd_backlight set 33%+
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d smc::kbd_backlight set 33%-
